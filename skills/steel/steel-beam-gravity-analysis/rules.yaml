skill_id: steel-beam-gravity-analysis
level: executable
purpose: Perform linear-elastic beam analysis for common gravity-beam support and loading cases, including direct equivalents of the beam behaviors summarized in AISC 15th Edition Manual Tables 3-22a, 3-22b, 3-22c, and 3-23.
analysis_basis:
  method: Euler-Bernoulli beam stiffness method
  assumptions:
    - linear_elastic
    - small_displacement
    - prismatic_constant_EI_in_current_release
    - loads_act_in_primary_bending_plane
supported_geometry:
  - single_span
  - multi_span_continuous
supported_supports:
  - pinned
  - roller
  - fixed
  - simple_shorthand
  - cantilever_shorthand
  - fixed_fixed_shorthand
  - propped_cantilever_shorthand
supported_loads:
  - full_span_uniform_dead_load
  - full_span_uniform_live_load
  - concentrated_point_loads
  - partial_uniform_loads
  - mixed_point_and_uniform_loads
load_categories:
  - dead
  - live
required_inputs:
  - load_level
  - span_ft_or_spans_ft
  - supports_or_support_condition
required_for_deflection_or_indeterminate_analysis:
  - E_ksi
  - Ix_in4
serviceability_defaults:
  live_load_limit: L/240
  total_load_limit: L/360
manual_alignment:
  table_3_22a: Concentrated loads are analyzed directly rather than converted to an approximate equivalent uniform load.
  table_3_22b: Cantilever beam behavior is solved directly.
  table_3_22c: Continuous beam behavior is solved directly.
  table_3_23: Reaction, shear, moment, and deflection outputs are generated directly and benchmarked against standard closed-form cases.
current_limits:
  - constant_EI_across_the_beam
  - no_applied_concentrated_moments_yet
  - no_linearly_varying_or_trapezoidal_distributed_loads_yet
  - no_support_settlement
  - no_shear_deformation
  - no_second_order_effects
  - no_torsion
  - no_composite_action
  - no_moving_load_envelope
forbidden:
  - Do not smear point loads into uniform loads when direct analysis is available.
  - Do not use factored loads for serviceability comparisons.
  - Do not invent stiffness for continuous or fixed-end beams.
  - Do not present the beam-analysis result as an AISC member-capacity check.
definition_of_done:
  - Geometry and supports validated.
  - Loads validated and retained at their actual locations.
  - Reactions reported at every support.
  - Positive and negative moment envelope values reported.
  - Maximum absolute shear reported.
  - Deflection reported when stiffness is available.
  - LL deflection compared with L/240 for service-level analysis.
  - D+L deflection compared with L/360 for service-level analysis.
  - QA/QC notes and engineer review requirement included.
