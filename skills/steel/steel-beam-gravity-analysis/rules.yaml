skill_id: steel-beam-gravity-analysis
level: executable
purpose: Perform engineer-supervised beam demand analysis for common and advanced gravity-beam effects before material-specific strength checks.
analysis_basis:
  primary_bending_method: finite_element_beam_stiffness
  default_bending_theory: Euler-Bernoulli
  optional_shear_deformation: Timoshenko with user-supplied effective shear area
  optional_second_order: elastic geometric stiffness, bounded analysis aid only
  optional_torsion: Saint-Venant torsion only
  assumptions:
    - linear_elastic_material_behavior
    - explicit_support_restraints
    - loads_act_in_the_defined_primary_bending_plane
    - no_silent_property_defaults
supported_geometry:
  - single_span
  - multi_span_continuous
supported_supports:
  - pinned
  - roller
  - fixed
  - imposed_vertical_support_settlement
supported_bending_loads:
  - full_span_uniform_loads
  - partial_uniform_loads
  - concentrated_point_loads
  - linearly_varying_triangular_loads
  - linearly_varying_trapezoidal_loads
  - concentrated_applied_moments
  - mixed_loading
  - moving_axle_patterns_with_direct_step_envelopes
stiffness:
  - constant_EI
  - piecewise_variable_EI
optional_analysis_effects:
  shear_deformation:
    requires: [G_ksi, Av_in2]
    note: Av_in2 is the effective shear area; juniorSE will not invent a shear correction factor.
  second_order:
    requires: [axial_force_lb]
    convention: positive compression, negative tension
    note: This is an elastic geometric-stiffness analysis aid and is not a complete AISC 360-16 Direct Analysis Method implementation.
  torsion:
    requires: [explicit_torsional_restraint, GJ]
    supports:
      - point_torques
      - linearly_varying_distributed_torques
      - piecewise_variable_GJ
    excludes:
      - warping_torsion
      - bimoment
      - warping_normal_stress
load_categories:
  - dead
  - live
serviceability_defaults:
  live_load_limit: L/240
  total_load_limit: L/360
aisc_context:
  standard: ANSI/AISC 360-16
  note: AISC 360-16 Chapter C requires consideration of second-order effects and stability in applicable steel design; this analysis skill does not itself perform a complete Direct Analysis Method check.
manual_alignment:
  table_3_22a: Concentrated loads are retained and analyzed directly rather than converted to approximate uniform loads.
  table_3_22b: Cantilever behavior is solved directly.
  table_3_22c: Continuous multi-span behavior is solved directly.
  table_3_23: Reaction, shear, moment, and deflection demand families are produced directly and benchmarked against closed-form mechanics.
forbidden:
  - Do not invent E, I, G, Av, J, support settlement, torsional restraint, or axial force.
  - Do not use factored loads for LL or D+L serviceability comparisons.
  - Do not imply that beam support type automatically restrains torsion.
  - Do not treat elastic geometric stiffness as a complete AISC Direct Analysis Method implementation.
  - Do not treat Saint-Venant torsion as a substitute for warping-torsion analysis when warping matters.
  - Do not present demand analysis as AISC member-capacity verification.
definition_of_done:
  - Geometry, supports, stiffness, and loads validated.
  - Reactions reported at supports.
  - Positive and negative bending demand reported.
  - Maximum absolute shear reported.
  - Deflection reported when stiffness is available.
  - Moving-load envelope reported when requested.
  - Torsional torque and rotation reported when requested.
  - LL and D+L deflection checked only when serviceability comparison is meaningful.
  - Unified demand envelope returned for downstream design skills.
  - QA/QC notes and engineer review requirement included.
