skill_id: steel-beam-gravity-analysis
level: executable
purpose: Perform bounded simply supported uniform-load beam analysis and service deflection checks.
current_scope:
  - simply_supported_uniform_gravity_load
  - reactions
  - maximum_shear
  - maximum_moment
  - service_deflection_when_E_and_Ix_are_provided
required_inputs:
  - span_ft
  - dead_load_plf
  - live_load_plf
  - load_level
  - support_condition
required_for_deflection:
  - E_ksi
  - Ix_in4
allowed_load_levels:
  - service
  - factored
allowed_support_conditions:
  - simple
  - simply_supported
  - simply supported
serviceability_defaults:
  live_load_limit: L/240
  total_load_limit: L/360
stop_conditions:
  - field: support_condition
    message: Current executable scope only supports simply supported beams.
  - field: load_level
    message: Loads must be identified as service or factored.
out_of_scope_currently:
  - continuous_beams
  - cantilevers
  - point_loads
  - partial_uniform_loads
  - composite_action
  - AISC_capacity_checks
  - final_stamped_design
forbidden:
  - Do not use analysis-only outputs as a member-capacity pass/fail.
  - Do not invent E or Ix for deflection.
  - Do not silently change LL L/240 and D+L L/360 default criteria.
definition_of_done:
  - Required analysis inputs validated.
  - Reactions, maximum shear, and maximum moment calculated.
  - Deflection reported as checked or incomplete.
  - Live-load deflection compared to L/240 when stiffness is available.
  - Total-load deflection compared to L/360 when stiffness is available.
  - QA/QC and engineer review notes included.
