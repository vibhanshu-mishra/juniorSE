skill_id: steel-beam-gravity-check
level: executable
purpose: Orchestrate AISC 360-16 steel member strength and serviceability checks from a standardized generalized beam-analysis result.
uses_skills:
  - steel-beam-gravity-analysis
  - steel-section-classification
  - steel-flexure-check
  - steel-shear-check
  - steel-web-local-checks
  - assumption-guardrails
  - calculation-qaqc-review
code_basis:
  primary: AISC 360-16
  classification_and_limits: Chapter B
  flexure: Chapter F
  shear: Chapter G
  web_local_checks: Chapter J10.2 and J10.3
preferred_interface:
  analysis_result: completed output from steel-beam-gravity-analysis used for strength demands
  service_analysis_result: optional completed service-level output used for deflection checks
supported_demand_sources:
  - uniform_loads
  - point_loads
  - triangular_and_trapezoidal_loads
  - concentrated_moments
  - continuous_beams
  - support_settlements
  - variable_EI
  - moving_load_envelopes
  - bounded_second_order_analysis
strength_routing:
  positive_moment: Chapter F check, sign preserved
  negative_moment: separate Chapter F check, sign preserved
  governing_shear: Chapter G check
  explicit_web_local_cases: Chapter J10.2 and J10.3
web_local_sources:
  - support_reaction
  - explicit_force
torsion_policy: Torsional demand is reported separately and is not treated as covered by Chapter F, G, or J10.
serviceability_defaults:
  live_load_limit: L/240
  total_load_limit: L/360
legacy_interface:
  status: supported_for_backward_compatibility
  scope: simple_span_uniform_load_only
  recommendation: use analysis_result for all new work
required_section_inputs:
  - code_family
  - code_edition
  - design_method
  - bracing_condition
  - steel_grade
  - member_section
  - composite_status
  - E_ksi
  - Fy_ksi
  - Ix_in4
  - Sx_in3
  - Zx_in3
  - d_in
  - h_in
  - tw_in
  - bf_in
  - tf_in
  - ry_in
  - rts_in
  - J_in4
  - ho_in
  - Lb_ft
  - Cb
blocked_or_deferred:
  - composite_beam_design
  - torsional_strength_design
  - biaxial_bending
  - connection_design
  - bearing_plate_design
