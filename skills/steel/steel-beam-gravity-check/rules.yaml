skill_id: steel-beam-gravity-check
level: executable
purpose: Perform bounded steel beam gravity check wrapper with simple-span analysis and serviceability checks under engineer supervision.
uses_skills:
  - steel-beam-gravity-analysis
  - assumption-guardrails
  - calculation-qaqc-review
current_scope:
  - simply_supported_uniform_gravity_load
  - analysis_demand
  - serviceability_check
  - strength_check_readiness
out_of_scope_currently:
  - AISC flexural capacity calculation
  - AISC shear capacity calculation
  - lateral-torsional buckling strength calculation
  - compactness classification
  - web yielding and web crippling
  - continuous beams
  - point loads
  - connection design
  - final stamped design
required_inputs:
  - code_family
  - code_edition
  - design_method
  - span_ft
  - dead_load_plf
  - live_load_plf
  - load_level
  - support_condition
  - bracing_condition
  - steel_grade
  - member_section
  - composite_status
required_for_serviceability:
  - E_ksi
  - Ix_in4
serviceability_defaults:
  live_load_limit: L/240
  total_load_limit: L/360
allowed_design_methods:
  - ASD
  - LRFD
allowed_load_levels:
  - service
  - factored
stop_conditions:
  - field: bracing_condition
    message: Cannot complete a steel beam check without lateral bracing or unbraced length information.
  - field: design_method
    message: Cannot proceed without ASD or LRFD.
  - field: load_level
    message: Cannot proceed until loads are identified as service-level or factored.
  - field: E_ksi
    message: Cannot complete serviceability check without modulus of elasticity.
  - field: Ix_in4
    message: Cannot complete serviceability check without moment of inertia.
forbidden:
  - Do not assume continuous bracing unless explicitly provided.
  - Do not claim AISC strength adequacy unless section properties and applicable AISC checks are performed.
  - Do not present analysis-only or serviceability-only results as final member approval.
  - Do not silently reverse LL L/240 and D+L L/360 serviceability criteria.
definition_of_done:
  - Required inputs validated.
  - Scope limitations stated.
  - Analysis demand calculated or referenced from steel-beam-gravity-analysis.
  - Live-load deflection compared to L/240.
  - Total-load deflection compared to L/360.
  - AISC strength checks performed or explicitly marked incomplete.
  - QA/QC and engineer review notes included.
