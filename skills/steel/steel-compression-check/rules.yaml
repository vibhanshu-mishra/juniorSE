skill_id: steel-compression-check
level: executable
code_basis:
  primary: AISC 360-16
  chapters: [B, E]
  implemented_sections: [E3, E7]
scope:
  section_types:
    - rolled_I
    - built_up_I
  symmetry: doubly_symmetric
  loading: axial_compression
  buckling_paths:
    - flexural_buckling_x
    - flexural_buckling_y
    - slender_element_effective_area
required_inputs:
  - design_method
  - section_type
  - Fy_ksi
  - E_ksi
  - Ag_in2
  - required_compression_kip
  - Lx_in
  - Ly_in
  - Kx
  - Ky
  - rx_in
  - ry_in
  - bf_in
  - tf_in
  - h_in
  - tw_in
  - e4_review_status
guardrails:
  - Do not assume Kx or Ky.
  - Do not silently ignore Chapter E4 torsional or flexural-torsional buckling.
  - Do not use this skill for HSS, pipe, angle, tee, or singly symmetric shapes.
  - Do not claim Chapter C global stability compliance from this member check.
  - If any compression element is slender, route through the Chapter E7 effective-area path.
compression_element_limits:
  rolled_I_flange: 0.56*sqrt(E/Fy)
  built_up_I_flange: 0.64*sqrt(kc*E/Fy), kc=4/sqrt(h/tw), 0.35<=kc<=0.76
  I_shape_web: 1.49*sqrt(E/Fy)
E7_constants:
  stiffened_web: {c1: 0.18, c2: 1.31}
  unstiffened_flange: {c1: 0.22, c2: 1.49}
available_strength:
  LRFD: {phi_c: 0.90}
  ASD: {omega_c: 1.67}
unsupported:
  - Chapter E4 calculation
  - singly symmetric shapes
  - HSS and pipe
  - angles and tees
  - built-up member connector requirements of E6
  - Chapter C stability certification
  - combined axial and flexural interaction
