skill_id: select-load-combinations
level: executable
purpose: Select and evaluate bounded ASCE 7 style ASD/LRFD load combinations while preventing ASD/LRFD and service/factored load mixing.
required_inputs:
  - code_family
  - code_edition
  - design_method
  - load_level
  - loads
  - objective
allowed_code_families:
  - ASCE 7
allowed_code_editions:
  - ASCE 7-16
  - ASCE 7-22
allowed_design_methods:
  - ASD
  - LRFD
allowed_load_levels:
  - service
  - factored
supported_load_cases:
  - D
  - L
  - Lr
  - S
  - R
  - W
  - E
unsupported_in_v0_3:
  - H
  - F
  - T
  - Fa
  - ice
  - crane
  - ponding
  - construction
  - load-duration or material-specific resistance modifiers
stop_conditions:
  - field: code_family
    message: Cannot select load combinations without governing load code family, such as ASCE 7.
  - field: code_edition
    message: Cannot claim code-specific combinations without code edition.
  - field: design_method
    message: Cannot select demand/capacity format without ASD or LRFD.
  - field: load_level
    message: Cannot proceed until loads are identified as service-level or factored.
  - field: loads
    message: Cannot evaluate combinations without numeric load magnitudes.
  - field: objective
    message: Cannot identify governing demand without objective/effect being checked.
  - field: unsupported_load_case
    message: Unsupported load cases must be handled outside this skill version or added intentionally with tests.
forbidden:
  - Do not mix ASD combinations with LRFD capacities.
  - Do not mix LRFD combinations with ASD allowable capacities.
  - Do not use already-factored loads in another factored combination unless explicitly directed and justified.
  - Do not claim final governing design if sign convention, directionality, code edition, or local amendments could change the result.
calculator_scope:
  implemented:
    - scalar evaluation of common ASCE 7-16/7-22 style ASD and LRFD combinations for D, L, Lr, S, R, W, and E
    - positive and negative wind/seismic direction variants
    - positive, negative, and absolute governing scalar effects
  not_implemented:
    - special seismic load effects and overstrength combinations
    - flood, soil, self-straining, crane, ice, ponding, construction, or local amendment provisions
    - automatic live-load companion reduction eligibility
    - multi-axis envelope logic
    - serviceability-specific code limits
definition_of_done:
  - Inputs summarized.
  - Design method stated.
  - Load level stated.
  - Applicable combination family stated.
  - Candidate combinations evaluated or blocked with reasons.
  - Governing positive/negative/absolute scalar effect reported when applicable.
  - Missing or excluded load types disclosed.
  - Limitations and engineer review note included.
